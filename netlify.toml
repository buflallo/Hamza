# Netlify builds the site itself (GitHub Actions is not needed for deploys).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Match the version CI uses.
  NODE_VERSION = "20"

# Vite fingerprints everything under /assets, so it can be cached for good.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
